<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dice Roller</title>
<style>
  :root{
    --felt:#1e4d3a;
    --felt2:#163829;
    --cream:#f3ecd8;
    --ink:#2a2118;
    --brass:#c9a15a;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; }
  body{
    background: radial-gradient(circle at 50% 45%, var(--felt), var(--felt2));
    color:var(--cream);
    font-family:Georgia, 'Segoe UI', serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:24px;
    padding:20px;
  }
  h1{
    color:var(--brass);
    letter-spacing:1px;
    font-size:1.4em;
    margin:0;
  }

  .controls{
    display:flex;
    gap:10px;
    align-items:center;
  }
  select, button{
    font-family:inherit;
    font-size:1em;
    padding:10px 18px;
    border:2px solid var(--brass);
    background:transparent;
    color:var(--cream);
    cursor:pointer;
    border-radius:4px;
  }
  select option{ color:#000; }
  button{
    background:var(--brass);
    color:#241d10;
    font-weight:bold;
  }
  button:hover{ filter:brightness(1.1); }
  button:disabled{ opacity:0.4; cursor:not-allowed; }

  .big-dice-row{
    display:flex;
    gap:28px;
    perspective:700px;
    min-height:110px;
    align-items:center;
    justify-content:center;
  }
  .big-die{
    width:90px; height:90px; position:relative;
    transform-style:preserve-3d;
  }
  .die-face{
    position:absolute; inset:0; box-sizing:border-box;
    border-radius:14px; background:var(--cream); border:3px solid var(--brass);
    box-shadow:0 6px 16px rgba(0,0,0,0.5);
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    padding:14px;
  }
  .pip{ width:13px; height:13px; border-radius:50%; background:var(--ink); justify-self:center; align-self:center; }

  .big-die.tumbling{ animation: dice-tumble 1.1s linear infinite; }
  .big-die.tumbling:nth-child(2){ animation-duration:0.92s; animation-direction:reverse; }
  .big-die.settled{ animation: dice-settle 0.6s cubic-bezier(.36,1.6,.6,1) both; }
  @keyframes dice-tumble{
    0%{ transform:translateY(0) rotateX(0deg) rotateY(0deg); }
    20%{ transform:translateY(-18px) rotateX(160deg) rotateY(110deg); }
    40%{ transform:translateY(4px) rotateX(300deg) rotateY(260deg); }
    60%{ transform:translateY(-12px) rotateX(480deg) rotateY(430deg); }
    80%{ transform:translateY(2px) rotateX(620deg) rotateY(590deg); }
    100%{ transform:translateY(0) rotateX(720deg) rotateY(760deg); }
  }
  @keyframes dice-settle{
    0%{ transform:translateY(-10px) rotateX(300deg) rotateY(340deg) scale(1.1); }
    55%{ transform:translateY(6px) rotateX(-14deg) rotateY(16deg) scale(0.92); }
    80%{ transform:translateY(-4px) rotateX(6deg) rotateY(-6deg) scale(1.04); }
    100%{ transform:translateY(0) rotateX(0deg) rotateY(0deg) scale(1); }
  }

  body.embed{ padding:10px; gap:10px; }
  body.embed h1, body.embed .history{ display:none; }
  body.embed select{ display:none; }

  .result{
    font-size:1.4em;
    color:var(--brass);
    min-height:1.4em;
    letter-spacing:1px;
  }
  .history{
    max-width:360px;
    text-align:center;
    color:#cfc49a;
    font-size:0.9em;
    min-height:1.2em;
  }
</style>
</head>
<body>

<h1>DICE ROLLER</h1>

<div class="controls">
  <select id="diceCount">
    <option value="1">1 die</option>
    <option value="2" selected>2 dice</option>
    <option value="3">3 dice</option>
  </select>
  <button id="rollBtn" onclick="roll()">Roll</button>
</div>

<div class="big-dice-row" id="diceRow"></div>
<div class="result" id="result"></div>
<div class="history" id="history"></div>

<script>
const DIE_PIPS = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
const DIE_FACE_SLOTS = {
  front:  "rotateY(0deg) translateZ(45px)",
  back:   "rotateY(180deg) translateZ(45px)",
  right:  "rotateY(90deg) translateZ(45px)",
  left:   "rotateY(-90deg) translateZ(45px)",
  top:    "rotateX(-90deg) translateZ(45px)",
  bottom: "rotateX(90deg) translateZ(45px)"
};
function dieFaceValues(front){
  const back = 7 - front;
  const rest = [1,2,3,4,5,6].filter(v => v !== front && v !== back);
  return { front, back, right:rest[0], left:rest[1], top:rest[2], bottom:rest[3] };
}
function pipsHTML(value){
  let html = "";
  for(let i=0;i<9;i++){
    html += DIE_PIPS[value].includes(i) ? `<div class="pip"></div>` : `<div></div>`;
  }
  return html;
}
function dieCubeHTML(value){
  const slots = dieFaceValues(value);
  return Object.keys(DIE_FACE_SLOTS).map(slot =>
    `<div class="die-face" style="transform:${DIE_FACE_SLOTS[slot]}">${pipsHTML(slots[slot])}</div>`
  ).join("");
}
function rnd(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

let rollHistory = [];
let rolling = false;

function renderDice(values, cls){
  document.getElementById('diceRow').innerHTML = values.map(v =>
    `<div class="big-die ${cls}">${dieCubeHTML(v)}</div>`
  ).join("");
}

function roll(){
  if(rolling) return;
  rolling = true;
  document.getElementById('rollBtn').disabled = true;
  const count = parseInt(document.getElementById('diceCount').value);
  const finalRoll = Array.from({length:count}, () => rnd(1,6));

  document.getElementById('result').textContent = '';
  let ticks = 0;
  const maxTicks = 16;
  const timer = setInterval(() => {
    const display = Array.from({length:count}, () => rnd(1,6));
    renderDice(display, 'tumbling');
    ticks++;
    if(ticks >= maxTicks){
      clearInterval(timer);
      renderDice(finalRoll, 'settled');
      const total = finalRoll.reduce((a,b)=>a+b,0);
      document.getElementById('result').textContent =
        count > 1 ? `${finalRoll.join(' + ')} = ${total}` : `${total}`;
      rollHistory.unshift(finalRoll.join(', ') + (count > 1 ? ` (total ${total})` : ''));
      rollHistory = rollHistory.slice(0, 5);
      document.getElementById('history').textContent = rollHistory.length ? 'Last rolls: ' + rollHistory.join('  ·  ') : '';
      rolling = false;
      document.getElementById('rollBtn').disabled = false;
      if(window.parent && window.parent !== window){
        window.parent.postMessage({ type:'diceRollResult', values: finalRoll, total: total }, '*');
      }
    }
  }, 140);
}

// show static dice at rest before first roll
renderDice([1,1], '');

// ---- embedding support ----
const params = new URLSearchParams(location.search);
if(params.get('embed') === '1'){
  document.body.classList.add('embed');
}
if(params.get('count')){
  document.getElementById('diceCount').value = params.get('count');
}

// report each roll result to whoever embedded this page
window.addEventListener('message', (e)=>{
  if(e.data && e.data.type === 'triggerRoll'){
    roll();
  }
});

</script>

</body>
</html>
