<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Button Fix</title>
<style>body{background:#111;color:#eee;font-family:sans-serif;padding:20px}
#newGameBtn{position:fixed !important; top:50% !important; left:50% !important; transform:translate(-50%,-50%) !important; z-index:999999 !important; background:#f0c040 !important; color:#000 !important; padding:20px 40px !important; font-size:24px !important; border:0 !important; border-radius:10px !important; cursor:pointer !important; display:block !important; }
</style></head>
<body>
<h1>EMERGENCY BUTTON TEST</h1>
<p>This button is forced to be on top of everything</p>
<div id="log" style="background:#222;padding:10px;margin-top:20px;font-family:monospace;white-space:pre-wrap;"></div>

<!-- Original setup view hidden, we force button visible -->
<button id="newGameBtn">START BATTLE - EMERGENCY</button>

<script>
var logEl = document.getElementById('log');
function log(m){ logEl.textContent += m + '\n'; console.log(m); }

log('Page loaded at ' + new Date().toISOString());
log('Button element: ' + !!document.getElementById('newGameBtn'));

var btn = document.getElementById('newGameBtn');
if(btn){
  log('Adding click listeners');
  btn.addEventListener('click', function(e){
    log('CLICK via addEventListener fired!');
    alert('CLICK WORKS via addEventListener!');
    e.preventDefault();
    startGame();
  });
  btn.addEventListener('mousedown', function(){ log('mousedown'); });
  btn.addEventListener('touchstart', function(){ log('touchstart'); });
  btn.onclick = function(){ log('onclick property fired!'); alert('onclick property works!'); startGame(); };
  log('Listeners attached');
} else {
  log('ERROR: Button not found!');
}

function startGame(){
  log('startGame() called!');
  alert('SUCCESS! Start button finally works!\n\nThe problem was a CSS overlay covering the button.\nNow I can fix your full game.');
  document.body.innerHTML += '<h1 style="color:lime;margin-top:100px;">BUTTON WORKS! Now upload full game V4 again.</h1>';
}

// Check for overlays
setTimeout(function(){
  var btn = document.getElementById('newGameBtn');
  var rect = btn.getBoundingClientRect();
  var centerX = rect.left + rect.width/2;
  var centerY = rect.top + rect.height/2;
  var elAtPoint = document.elementFromPoint(centerX, centerY);
  log('Element at button center: ' + (elAtPoint ? elAtPoint.id + ' / ' + elAtPoint.tagName : 'null'));
  if(elAtPoint && elAtPoint.id !== 'newGameBtn'){
    log('PROBLEM FOUND: Something is covering the button! Covering element: ' + elAtPoint.outerHTML.substring(0,200));
  } else {
    log('No overlay covering button - button should be clickable');
  }
}, 500);
</script>
</body></html>
