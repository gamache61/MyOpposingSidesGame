<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opposing Sides - Test</title>
<style>
body{ background:#0f1115; color:#eee; font-family: sans-serif; text-align:center; padding:40px; }
button{ background:#d9a441; color:#000; border:0; padding:16px 32px; font-size:18px; border-radius:8px; cursor:pointer; margin:10px; }
button:hover{ background:#f0c040; }
#log{ background:#1a1d24; border:1px solid #333; padding:15px; margin:20px auto; max-width:600px; text-align:left; font-family:monospace; font-size:12px; white-space:pre-wrap; }
</style>
</head>
<body>
<h1>Opposing Sides - GitHub Pages Test</h1>
<p>If you see this, GitHub Pages is serving the NEW file (not cached).</p>
<p>Time: <span id="time"></span></p>

<button id="newGameBtn" onclick="startGame()">START BATTLE - Test Button</button>
<button onclick="location.reload(true)">Reload</button>
<button onclick="clearCache()">Clear Cache & Reload</button>

<div id="log"></div>

<script>
document.getElementById('time').textContent = new Date().toISOString();

function log(msg){
  var el=document.getElementById('log');
  el.textContent += msg + '\n';
  console.log(msg);
}

log('Page loaded: ' + location.href);
log('UserAgent: ' + navigator.userAgent);

// Kill old service workers
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    log('Found ' + regs.length + ' service workers');
    regs.forEach(function(r){ 
      r.unregister(); 
      log('Unregistered SW: ' + r.scope);
    });
  });
}
if('caches' in window){
  caches.keys().then(function(keys){
    log('Found caches: ' + keys.join(', '));
    keys.forEach(function(k){ caches.delete(k); log('Deleted cache: '+k); });
  });
}

function startGame(){
  log('START BATTLE clicked!');
  try{
    // Test all elements from original game
    var ids = ['atkCountry','defCountry','atkName','defName','setupError','pageTitle','setupView','topbar','pauseBtn','mapView','turnAnnounce','hint','atkInfo','defInfo'];
    ids.forEach(function(id){
      var el=document.getElementById(id);
      log(id + ': ' + (el ? 'FOUND' : 'MISSING - will be created'));
    });
    
    alert('Start button WORKS! The problem was caching. Now upload the full game file again.');
    log('SUCCESS - Start button works!');
  }catch(e){
    log('ERROR: ' + e.message + '\n' + e.stack);
    alert('Error: ' + e.message);
  }
}

function clearCache(){
  if('caches' in window){
    caches.keys().then(function(keys){
      Promise.all(keys.map(function(k){ return caches.delete(k); })).then(function(){
        log('All caches cleared, reloading...');
        location.reload(true);
      });
    });
  } else {
    location.reload(true);
  }
}
</script>
</body>
</html>
