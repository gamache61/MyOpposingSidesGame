<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Opposing Sides Game - V4 FIXED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
#setupView{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;z-index:10;}
#setupView h1{font-size:42px;margin-bottom:10px;color:#f0c040;letter-spacing:2px}
#setupView p{opacity:.7;margin-bottom:30px}
.setup-card{background:#1a1a24;border:1px solid #2a2a3a;border-radius:12px;padding:24px;width:100%;max-width:520px;margin-bottom:20px}
.setup-card h3{margin-bottom:12px;color:#f0c040}
.row{display:flex;gap:10px;margin-bottom:12px}
.row button{flex:1;padding:12px;background:#252535;border:1px solid #3a3a4a;color:#fff;border-radius:8px;cursor:pointer}
.row button.selected{background:#f0c040;color:#000;border-color:#f0c040;font-weight:bold}

#newGameBtn{
 position:relative !important;
 z-index:999999 !important;
 display:block !important;
 width:100%;max-width:520px;
 background:#f0c040 !important;
 color:#000 !important;
 font-size:22px !important;font-weight:800 !important;
 padding:20px !important;
 border:0 !important;border-radius:12px !important;
 cursor:pointer !important;
 box-shadow:0 0 30px rgba(240,192,64,.5);
 pointer-events:auto !important;
}
#newGameBtn:active{transform:scale(.98)}

#gameView{display:none;min-height:100vh;padding:20px}
#gameView.active{display:block}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.battlefield{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1000px;margin:0 auto}
.side{background:#16161f;border:1px solid #2a2a3a;border-radius:12px;padding:16px;min-height:400px}
.side h2{text-align:center;margin-bottom:12px}
.units{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.unit{width:60px;height:60px;background:#252535;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;border:1px solid #3a3a4a}
.log{background:#0f0f14;border:1px solid #222;border-radius:8px;padding:12px;height:160px;overflow:auto;font-family:monospace;font-size:13px;margin-top:20px}
</style>
</head>
<body>

<div id="setupView">
  <h1>OPPOSING SIDES</h1>
  <p>Tactical Battle Simulator - V4 Fixed</p>
  
  <div class="setup-card">
    <h3>Choose Your Faction</h3>
    <div class="row">
      <button class="faction-btn selected" data-faction="knights">⚔️ Knights</button>
      <button class="faction-btn" data-faction="orcs">👹 Orcs</button>
    </div>
    <div class="row">
      <button class="faction-btn" data-faction="elves">🧝 Elves</button>
      <button class="faction-btn" data-faction="undead">💀 Undead</button>
    </div>
  </div>

  <div class="setup-card">
    <h3>Difficulty</h3>
    <div class="row">
      <button class="diff-btn selected" data-diff="normal">Normal</button>
      <button class="diff-btn" data-diff="hard">Hard</button>
      <button class="diff-btn" data-diff="insane">Insane</button>
    </div>
  </div>

  <!-- FIXED BUTTON WITH INLINE HANDLER + JS HANDLER -->
  <button id="newGameBtn" onclick="window._startGameSafe()">START BATTLE - CLICK ME</button>
  <div id="debug" style="margin-top:15px;font-family:monospace;font-size:12px;opacity:.6;"></div>
</div>

<div id="gameView">
  <div class="topbar">
    <h2 id="battleTitle">Battle!</h2>
    <button onclick="location.reload()" style="padding:8px 16px;background:#333;color:#fff;border:0;border-radius:6px;cursor:pointer">Restart</button>
  </div>
  <div class="battlefield">
    <div class="side"><h2 id="playerSideName">Your Army</h2><div id="playerUnits" class="units"></div></div>
    <div class="side"><h2 id="enemySideName">Enemy Army</h2><div id="enemyUnits" class="units"></div></div>
  </div>
  <div class="log" id="battleLog"></div>
  <button id="attackBtn" style="margin:20px auto;display:block;padding:14px 30px;background:#f0c040;color:#000;border:0;border-radius:10px;font-weight:800;font-size:18px;cursor:pointer">ATTACK!</button>
</div>

<script>
console.log('V4 Fixed script loading');
const $ = s => document.querySelector(s);
function logDbg(m){ const el=$('#debug'); if(el) el.textContent+=m+'\n'; console.log(m); }

let selectedFaction='knights';
let selectedDiff='normal';

document.addEventListener('DOMContentLoaded', ()=>{
  logDbg('DOM Ready - attaching listeners');
  
  document.querySelectorAll('.faction-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.faction-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      selectedFaction=b.dataset.faction;
      logDbg('Faction: '+selectedFaction);
    });
  });
  document.querySelectorAll('.diff-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.diff-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      selectedDiff=b.dataset.diff;
    });
  });

  const btn = document.getElementById('newGameBtn');
  if(!btn){ alert('CRITICAL: newGameBtn not found!'); return; }
  
  // Attach 4 different ways so ONE will work
  const handler = (e)=>{
    logDbg('Button event: '+(e?e.type:'inline'));
    if(e){ e.preventDefault(); e.stopPropagation(); }
    window._startGameSafe();
  };
  btn.addEventListener('click', handler);
  btn.addEventListener('touchend', handler);
  btn.addEventListener('pointerup', handler);
  
  logDbg('Button listeners attached - READY');
  logDbg('Button at: '+btn.getBoundingClientRect().width+'px wide');
});

window._startGameSafe = function(){
  logDbg('_startGameSafe called');
  try{
    startGame();
  }catch(err){
    console.error(err);
    alert('Game crashed inside startGame():\n\n'+err.message+'\n\nCheck console (F12) for details');
    logDbg('ERROR: '+err.message+'\n'+err.stack);
  }
};

function startGame(){
  console.log('startGame() executing with faction='+selectedFaction);
  const setup = document.getElementById('setupView');
  const game = document.getElementById('gameView');
  if(!setup || !game) throw new Error('setupView or gameView missing');
  
  // Hide setup, show game
  setup.style.display='none';
  game.style.display='block';
  game.classList.add('active');

  const icons={knights:['⚔️','🛡️','🐴','🏹'], orcs:['👹','🪓','🐗','🔥'], elves:['🧝','🦌','🏹','✨'], undead:['💀','🦴','🧟','☠️']};
  const names={knights:'Knights',orcs:'Orc Horde',elves:'Elven Guard',undead:'Undead Legion'};
  
  const playerIcons = icons[selectedFaction] || icons.knights;
  const enemyFaction = Object.keys(icons).filter(k=>k!==selectedFaction)[Math.floor(Math.random()*3)];
  const enemyIcons = icons[enemyFaction];

  document.getElementById('playerSideName').textContent = names[selectedFaction];
  document.getElementById('enemySideName').textContent = names[enemyFaction];
  document.getElementById('battleTitle').textContent = names[selectedFaction]+' vs '+names[enemyFaction]+' - '+selectedDiff;

  const playerDiv = document.getElementById('playerUnits');
  const enemyDiv = document.getElementById('enemyUnits');
  playerDiv.innerHTML=''; enemyDiv.innerHTML='';
  
  for(let i=0;i<8;i++){
    let d=document.createElement('div'); d.className='unit'; d.textContent=playerIcons[i%playerIcons.length]; playerDiv.appendChild(d);
  }
  for(let i=0;i<8;i++){
    let d=document.createElement('div'); d.className='unit'; d.textContent=enemyIcons[i%enemyIcons.length]; enemyDiv.appendChild(d);
  }

  const logEl=document.getElementById('battleLog');
  logEl.textContent='Battle started! Faction: '+selectedFaction+' | Difficulty: '+selectedDiff+'\nClick ATTACK to fight!\n';

  document.getElementById('attackBtn').onclick = ()=>{
    const msgs=['Your knights charge!','Enemy counters!','Arrows fly!','A mighty blow!','Units clash!'];
    logEl.textContent+=msgs[Math.floor(Math.random()*msgs.length)]+'\n';
    logEl.scrollTop=logEl.scrollHeight;
    // flicker units
    document.querySelectorAll('.unit').forEach(u=>{
      u.style.transform='scale(1.1)'; setTimeout(()=>u.style.transform='',150);
    });
  };

  logDbg('Game started successfully!');
}
</script>
</body>
</html>
